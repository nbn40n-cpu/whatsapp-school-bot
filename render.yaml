services:
  - type: web
    name: whatsapp-school-bot
    env: node
    buildCommand: npm install
    startCommand: node baileys-bot.js
    healthCheckPath: /health
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: SCHOOL_PHONE
        value: "0568444407"
      - key: DATA_DIR
        value: "/data"
      - key: PANEL_PASSWORD
        sync: false
